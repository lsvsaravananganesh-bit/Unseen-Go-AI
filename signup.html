<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create an UnseenGo AI account"><title>Sign up — UnseenGo AI</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-wrap"><a class="auth-brand" href="index.html">✦ UnseenGo <b>AI</b></a><section class="auth-card"><p class="auth-eyebrow">START EXPLORING</p><h1>Create account.</h1><p class="auth-sub">Create your traveller account and start discovering India's unseen side.</p><form id="signupForm"><div class="auth-field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" required placeholder="Your name"></div><div class="auth-field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="auth-field"><label for="password">Password</label><div class="auth-input-wrap"><input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"><button class="auth-toggle" id="togglePassword" type="button">Show</button></div></div><div class="auth-field"><label for="confirmPassword">Confirm password</label><div class="auth-input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Re-enter your password"><button class="auth-toggle" id="toggleConfirm" type="button">Show</button></div></div><button class="auth-submit" id="signupButton" type="submit">CREATE MY ACCOUNT</button></form><div id="message" class="auth-message" aria-live="polite"></div><p class="auth-switch">Already have an account? <a href="login.html">Login</a></p><div class="auth-back"><a href="index.html">← Back to UnseenGo AI</a></div></section></main><script src="supabase-config.js?v=20260825"></script><script src="supabase-client.js?v=20260825"></script><script src="auth.js?v=20260825"></script><script>document.addEventListener('DOMContentLoaded',()=>{[['togglePassword','password'],['toggleConfirm','confirmPassword']].forEach(([b,i])=>document.getElementById(b).onclick=()=>{const x=document.getElementById(i),v=x.type==='text';x.type=v?'password':'text';document.getElementById(b).textContent=v?'Show':'Hide';});});</script></body></html>
