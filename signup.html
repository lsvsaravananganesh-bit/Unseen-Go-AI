<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Create an UnseenGo AI account"><title>Sign up — UnseenGo AI</title>
<style>
*{box-sizing:border-box}html{background:#070a08}body{margin:0;min-height:100vh;background:#070a08;color:#f5f7f1;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 18px}.wrap{width:min(460px,100%)}.brand{display:block;text-align:center;color:#fff;text-decoration:none;font-size:25px;font-weight:850;margin-bottom:24px}.brand b{color:#d9ff54}.card{background:#101511;border:1px solid #293129;border-radius:25px;padding:34px;box-shadow:0 28px 90px #0008}.eyebrow{text-align:center;color:#d9ff54;font-size:11px;letter-spacing:3px;font-weight:850;margin:0 0 10px}.card h1{text-align:center;font-size:36px;letter-spacing:-1.3px;margin:0 0 9px}.sub{text-align:center;color:#a7afa6;line-height:1.6;font-size:14px;margin:0 auto 28px;max-width:340px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:650;color:#d0d5cf;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border:1px solid #303930;background:#090d0a;color:#fff;border-radius:12px;outline:0;font-size:15px}.field input:focus{border-color:#d9ff54;box-shadow:0 0 0 3px #d9ff5417}.pass{position:relative}.pass input{padding-right:65px}.toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:none;color:#8e978e;cursor:pointer}.toggle:hover{color:#d9ff54}.submit{width:100%;border:0;border-radius:12px;padding:15px;background:#d9ff54;color:#080b08;font-weight:850;cursor:pointer;margin-top:4px}.submit:disabled{opacity:.6}.msg{text-align:center;min-height:22px;margin-top:15px;font-size:13px;line-height:1.5}.error{color:#ff9d9d}.success{color:#d9ff54}.switch{text-align:center;color:#929a92;font-size:14px;margin:22px 0 0}.switch a{color:#d9ff54;font-weight:750;text-decoration:none}.back{text-align:center;margin-top:18px}.back a{color:#8f9890;text-decoration:none;font-size:13px}.back a:hover{color:#fff}@media(max-width:500px){.card{padding:27px 20px}.card h1{font-size:33px}}
</style>
</head>
<body><main class="wrap"><a class="brand" href="index.html">✦ UnseenGo <b>AI</b></a><section class="card"><p class="eyebrow">START EXPLORING</p><h1>Create account.</h1><p class="sub">Create your traveller account and start discovering India's unseen side.</p><form id="signupForm"><div class="field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" required placeholder="Your name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><div class="pass"><input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"><button class="toggle" id="togglePassword" type="button">Show</button></div></div><div class="field"><label for="confirmPassword">Confirm password</label><div class="pass"><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Re-enter your password"><button class="toggle" id="toggleConfirm" type="button">Show</button></div></div><button class="submit" id="signupButton" type="submit">CREATE MY ACCOUNT</button></form><div id="message" class="msg" aria-live="polite"></div><p class="switch">Already have an account? <a href="login.html">Login</a></p><div class="back"><a href="index.html">← Back to UnseenGo AI</a></div></section></main><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{[['togglePassword','password'],['toggleConfirm','confirmPassword']].forEach(([b,i])=>document.getElementById(b).onclick=()=>{const x=document.getElementById(i),v=x.type==='text';x.type=v?'password':'text';document.getElementById(b).textContent=v?'Show':'Hide';});});</script></body></html>
