<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Create an UnseenGo AI account">
  <title>Create account — UnseenGo AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b09;color:#f5f5ef;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(210,255,65,.08),transparent 35%),radial-gradient(circle at 80% 80%,rgba(210,255,65,.05),transparent 35%);pointer-events:none}.auth-wrap{width:min(440px,100%);position:relative}.brand{display:block;text-align:center;text-decoration:none;color:#fff;font-size:24px;font-weight:800;margin-bottom:28px}.brand b{color:#d9ff54}.auth-card{border:1px solid #293029;background:#101511;border-radius:24px;padding:34px;box-shadow:0 25px 70px rgba(0,0,0,.35)}.eyebrow{color:#d9ff54;font-size:12px;letter-spacing:3px;font-weight:800;text-align:center;margin:0 0 10px}.auth-card h1{text-align:center;font-size:36px;line-height:1.05;margin:0 0 10px}.sub{text-align:center;color:#a6ada5;margin:0 0 28px;line-height:1.6}.field{margin-bottom:17px}.field label{display:block;font-size:13px;color:#c7ccc6;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border:1px solid #303830;background:#0a0e0b;color:#fff;border-radius:12px;outline:none;font-size:15px}.field input:focus{border-color:#d9ff54;box-shadow:0 0 0 3px rgba(217,255,84,.08)}.submit{width:100%;border:0;border-radius:12px;padding:15px;background:#d9ff54;color:#090c09;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px}.submit:disabled{opacity:.6;cursor:not-allowed}.message{min-height:22px;margin:16px 0 0;text-align:center;font-size:13px;line-height:1.5}.message.error{color:#ff9f9f}.message.success{color:#d9ff54}.switch{text-align:center;color:#929a92;font-size:14px;margin:22px 0 0}.switch a{color:#d9ff54;text-decoration:none;font-weight:700}.back{text-align:center;margin-top:18px}.back a{color:#9da59d;text-decoration:none;font-size:13px}.back a:hover{color:#fff}
  </style>
</head>
<body>
  <main class="auth-wrap">
    <a class="brand" href="index.html">✦ UnseenGo <b>AI</b></a>
    <section class="auth-card">
      <p class="eyebrow">START EXPLORING</p>
      <h1>Create account.</h1>
      <p class="sub">Save your travel journey and get ready for personalized discovery.</p>
      <form id="signupForm">
        <div class="field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" required placeholder="Your name"></div>
        <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"></div>
        <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="Re-enter your password"></div>
        <button class="submit" id="signupButton" type="submit">Create my account</button>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
      <p class="switch">Already have an account? <a href="login.html">Login</a></p>
      <div class="back"><a href="index.html">← Back to UnseenGo AI</a></div>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
</body>
</html>
