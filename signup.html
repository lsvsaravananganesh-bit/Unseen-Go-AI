<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create an UnseenGo AI account">
  <title>Sign up — UnseenGo AI</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <a class="brand auth-brand" href="index.html">✦ UnseenGo <b>AI</b></a>

    <section class="auth-card" aria-labelledby="signupTitle">
      <p class="auth-eyebrow">✦ START EXPLORING</p>
      <h1 id="signupTitle">Create account.</h1>
      <p class="auth-sub">Create your traveller account and start discovering India's unseen side.</p>

      <!-- Demo quick launch banner -->
      <div class="demo-chip-bar" style="margin-bottom:20px">
        <div class="demo-chip-text">
          <span>Just evaluating? <code>1-Click Demo Access</code></span>
        </div>
        <a href="login.html" class="demo-chip-btn" style="text-decoration:none;display:inline-block">Demo Mode →</a>
      </div>

      <form id="signupForm" novalidate>
        <div class="auth-field">
          <label for="name">Full name</label>
          <input id="name" type="text" autocomplete="name" required placeholder="Your name">
        </div>

        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="auth-input-wrap">
            <input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters">
            <button class="auth-toggle" id="togglePassword" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirmPassword">Confirm password</label>
          <div class="auth-input-wrap">
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Re-enter your password">
            <button class="auth-toggle" id="toggleConfirm" type="button" aria-label="Show password">Show</button>
          </div>
        </div>

        <button class="auth-submit" id="signupButton" type="submit">CREATE MY ACCOUNT</button>
      </form>

      <div id="message" class="auth-message" aria-live="polite"></div>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Login</a>
      </p>

      <div class="auth-back">
        <a href="index.html">← Back to UnseenGo AI</a>
      </div>
    </section>
  </main>

  <script src="supabase-config.js?v=20260826a"></script>
  <script src="supabase-client.js?v=20260826a"></script>
  <script src="auth.js?v=20260923"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      [['togglePassword', 'password'], ['toggleConfirm', 'confirmPassword']].forEach(([b, i]) => {
        const btn = document.getElementById(b);
        const input = document.getElementById(i);
        if (btn && input) {
          btn.onclick = () => {
            const isText = input.type === 'text';
            input.type = isText ? 'password' : 'text';
            btn.textContent = isText ? 'Show' : 'Hide';
            btn.setAttribute('aria-label', isText ? 'Show password' : 'Hide password');
          };
        }
      });
    });
  </script>
</body>
</html>
