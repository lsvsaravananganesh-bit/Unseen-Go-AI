<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — UnseenGo AI</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070a08;color:#f5f7f1;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#101511;border:1px solid #293129;border-radius:24px;padding:32px}.brand{text-align:center;font-size:24px;font-weight:850;margin-bottom:24px}.brand b{color:#d9ff54}.eyebrow{text-align:center;color:#d9ff54;font-size:11px;letter-spacing:3px}.card h1{text-align:center}.sub{text-align:center;color:#9da59d;line-height:1.5}.field{margin:18px 0}.field label{display:block;margin-bottom:8px;font-size:13px}.field input{width:100%;padding:14px;border-radius:11px;border:1px solid #303930;background:#090d0a;color:#fff}.button{width:100%;padding:14px;border:0;border-radius:11px;background:#d9ff54;font-weight:850;cursor:pointer}.msg{text-align:center;min-height:22px;margin-top:15px;font-size:13px}.error{color:#ff9d9d}.success{color:#d9ff54}.back{text-align:center;margin-top:18px}.back a{color:#9da59d}</style><link rel="stylesheet" href="/Unseen-Go-AI/unseengo-usa-theme.css?v=20260827" data-unseengo-usa-theme="1"></head><body><main class="card"><div class="brand">✦ UnseenGo <b>AI</b></div><p class="eyebrow">SECURE YOUR ACCOUNT</p><h1>Set a new password</h1><p class="sub">Choose a new password for your UnseenGo AI account.</p><form id="resetForm"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="6" required placeholder="Re-enter password"></div><button class="button" type="submit">UPDATE PASSWORD</button></form><div id="message" class="msg"></div><div class="back"><a href="login.html">← Back to login</a></div></main><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message'),p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c){m.textContent='Passwords do not match.';m.className='msg error';return}const sb=window.unseenGoSupabase;if(!sb){m.textContent='Connection not ready. Refresh and try again.';m.className='msg error';return}const {error}=await sb.auth.updateUser({password:p});if(error){m.textContent=error.message;m.className='msg error'}else{m.textContent='Password updated. You can now login.';m.className='msg success';setTimeout(()=>location.href='login.html',1000)}});</script></body></html>
