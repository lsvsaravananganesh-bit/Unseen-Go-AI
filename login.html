<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Login to UnseenGo AI">
  <title>Login — UnseenGo AI</title>
  <style>
    *{box-sizing:border-box}html{min-height:100%;background:#070a08}body{margin:0;min-height:100vh;background:#070a08;color:#f5f7f1;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 20px;overflow-x:hidden}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 18% 15%,rgba(217,255,84,.12),transparent 28%),radial-gradient(circle at 84% 85%,rgba(217,255,84,.07),transparent 25%);pointer-events:none}.auth-wrap{width:min(460px,100%);position:relative;z-index:1}.brand{display:flex;justify-content:center;align-items:center;gap:7px;text-decoration:none;color:#fff;font-size:25px;font-weight:850;letter-spacing:-.8px;margin-bottom:24px}.brand b{color:#d9ff54}.auth-card{border:1px solid #283028;background:rgba(15,20,16,.94);border-radius:26px;padding:36px;box-shadow:0 28px 90px rgba(0,0,0,.48);backdrop-filter:blur(14px)}.eyebrow{color:#d9ff54;font-size:11px;letter-spacing:3px;font-weight:850;text-align:center;margin:0 0 11px}.auth-card h1{text-align:center;font-size:38px;letter-spacing:-1.5px;line-height:1.05;margin:0 0 9px}.sub{text-align:center;color:#a7afa6;margin:0 auto 30px;line-height:1.6;max-width:330px;font-size:14px}.field{margin-bottom:18px}.field label{display:block;font-size:13px;color:#d0d5cf;margin-bottom:8px;font-weight:650}.input-wrap{position:relative}.field input{width:100%;padding:14px 15px;border:1px solid #303930;background:#090d0a;color:#fff;border-radius:12px;outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}.field input:focus{border-color:#d9ff54;box-shadow:0 0 0 3px rgba(217,255,84,.09)}.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#899188;cursor:pointer;font-size:12px;padding:6px}.password-toggle:hover{color:#d9ff54}.forgot{display:block;text-align:right;margin:-6px 0 20px;color:#aab2a9;font-size:13px;text-decoration:none}.forgot:hover{color:#d9ff54}.submit{width:100%;border:0;border-radius:12px;padding:15px;background:#d9ff54;color:#090c09;font-weight:850;font-size:14px;cursor:pointer;transition:transform .18s,filter .18s}.submit:hover{transform:translateY(-1px);filter:brightness(1.04)}.submit:disabled{opacity:.6;cursor:not-allowed;transform:none}.message{min-height:21px;margin:15px 0 0;text-align:center;font-size:13px;line-height:1.5}.message.error{color:#ff9d9d}.message.success{color:#d9ff54}.switch{text-align:center;color:#929a92;font-size:14px;margin:23px 0 0}.switch a{color:#d9ff54;text-decoration:none;font-weight:750}.switch a:hover{text-decoration:underline}.back{text-align:center;margin-top:18px}.back a{color:#8f9890;text-decoration:none;font-size:13px}.back a:hover{color:#fff}@media(max-width:520px){body{padding:20px 14px}.auth-card{padding:28px 21px;border-radius:22px}.auth-card h1{font-size:34px}.brand{font-size:23px;margin-bottom:20px}}
  </style>
</head>
<body>
  <main class="auth-wrap">
    <a class="brand" href="index.html">✦ UnseenGo <b>AI</b></a>
    <section class="auth-card" aria-labelledby="loginTitle">
      <p class="eyebrow">WELCOME BACK, TRAVELLER</p>
      <h1 id="loginTitle">Sign in.</h1>
      <p class="sub">Continue discovering hidden places and planning your next journey.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="your@email.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Enter your password">
            <button class="password-toggle" id="togglePassword" type="button" aria-label="Show password">Show</button>
          </div>
        </div>
        <a class="forgot" href="#" id="forgotPassword">Forgot password?</a>
        <button class="submit" id="loginButton" type="submit">LOGIN</button>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
      <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      <div class="back"><a href="index.html">← Back to UnseenGo AI</a></div>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded',function(){
      const input=document.getElementById('password');
      const toggle=document.getElementById('togglePassword');
      toggle.addEventListener('click',function(){const visible=input.type==='text';input.type=visible?'password':'text';toggle.textContent=visible?'Show':'Hide';toggle.setAttribute('aria-label',visible?'Show password':'Hide password');});
      document.getElementById('forgotPassword').addEventListener('click',function(e){e.preventDefault();const email=document.getElementById('email').value.trim();const msg=document.getElementById('message');if(!email){msg.textContent='Enter your email first, then choose Forgot password.';msg.className='message error';return;}window.UnseenGoAuthForgotPassword?.(email);});
    });
  </script>
</body>
</html>
