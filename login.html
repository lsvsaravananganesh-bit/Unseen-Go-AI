<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Login to UnseenGo AI"><title>Login — UnseenGo AI</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="auth.css"></head><body class="auth-page"><main class="auth-wrap"><a class="brand auth-brand" href="index.html">✦ UnseenGo <b>AI</b></a><section class="auth-card" aria-labelledby="loginTitle"><p class="eyebrow">WELCOME BACK, TRAVELLER</p><h1 id="loginTitle">Sign in.</h1><p class="sub">Continue discovering hidden places and planning your next journey.</p><form id="loginForm" novalidate><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="your@email.com"></div><div class="field"><label for="password">Password</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Enter your password"><button class="password-toggle" id="togglePassword" type="button" aria-label="Show password">Show</button></div></div><a class="forgot" href="#" id="forgotPassword">Forgot password?</a><button class="submit" id="loginButton" type="submit">LOGIN</button></form><div id="message" class="message" aria-live="polite"></div><p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p><div class="back"><a href="index.html">← Back to UnseenGo AI</a></div></section></main><script src="supabase-config.js?v=20260825c"></script><script src="supabase-client.js?v=20260825c"></script><script src="auth.js?v=20260825c"></script><script>document.addEventListener('DOMContentLoaded',function(){const input=document.getElementById('password');const toggle=document.getElementById('togglePassword');toggle.addEventListener('click',function(){const visible=input.type==='text';input.type=visible?'password':'text';toggle.textContent=visible?'Show':'Hide';toggle.setAttribute('aria-label',visible?'Show password':'Hide password');});document.getElementById('forgotPassword').addEventListener('click',function(e){e.preventDefault();const email=document.getElementById('email').value.trim();const msg=document.getElementById('message');if(!email){msg.textContent='Enter your email first, then choose Forgot password.';msg.className='message error';return;}window.UnseenGoAuthForgotPassword?.(email);});});</script></body></html>
