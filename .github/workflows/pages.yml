name: Deploy UnseenGo AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Apply UnseenGo USA editorial theme to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="/Unseen-Go-AI/theme.js?v=20260827" defer></script>'
          css='<link rel="stylesheet" href="/Unseen-Go-AI/unseengo-usa-theme.css?v=20260827">'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if 'unseengo-usa-theme.css' not in s:
                  s=s.replace('</head>', css+'\n</head>',1) if '</head>' in s else s
              if 'theme.js?v=20260827' not in s and 'theme.js' not in s:
                  s=s.replace('</head>', tag+'\n</head>',1) if '</head>' in s else s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
