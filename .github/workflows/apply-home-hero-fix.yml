name: Apply homepage hero fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply once
        run: |
          MARKER="/* HOMEPAGE HERO POSITION FIX 2026-08-27 */"
          if grep -q "$MARKER" unseengo-system.css; then exit 0; fi
          cat >> unseengo-system.css <<'EOF'

/* HOMEPAGE HERO POSITION FIX 2026-08-27 */
body:has(.hero){background:#07100b!important;color:#fff!important}
.hero{min-height:980px!important;position:relative!important}
.hero-bg{background-position:center 18%!important}
.hero-content{position:absolute!important;top:145px!important;left:max(20px,calc((100% - 1280px)/2))!important;right:auto!important;bottom:auto!important;padding:0!important;max-width:820px!important}
.search{top:555px!important;bottom:auto!important;width:min(1100px,calc(100% - 40px))!important;background:rgba(7,16,11,.98)!important;color:#fff!important;border:1px solid #304033!important;box-shadow:0 24px 65px rgba(0,0,0,.5)!important;padding:12px!important}
.tabs{border-bottom-color:#2d3c31!important}.tabs a{color:#aeb9b0!important}.tabs a.active,.tabs a:hover{background:#1b2a1b!important;color:#d8f36a!important}
.field{background:#0d1911!important;border-color:#2c3c30!important;color:#fff!important}.field small{color:#839087!important}.field input,.field select{color:#f3f7f1!important}.field input::placeholder{color:#819087!important}.quick span{color:#8e9b92!important}.quick button{background:#101d14!important;border-color:#344337!important;color:#d7dfd6!important}.go{background:#d8f36a!important;color:#101510!important}
@media(max-width:950px){.hero{min-height:980px!important}.hero-content{left:20px!important;right:20px!important;top:125px!important;max-width:none!important}.search{top:535px!important}.section{padding-top:225px!important}}
@media(max-width:650px){.hero{min-height:1020px!important}.hero-bg{background-position:center 10%!important}.hero-content{top:92px!important;left:14px!important;right:14px!important}.hero h1{font-size:48px!important;letter-spacing:-3px!important}.hero p{font-size:15px!important;line-height:1.55!important}.hero-links{margin-top:18px!important}.search{top:490px!important;bottom:auto!important;width:calc(100% - 28px)!important}.section{padding-top:245px!important}}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unseengo-system.css
          git commit -m "Fix homepage Taj Mahal and search panel layout" || exit 0
          git push
