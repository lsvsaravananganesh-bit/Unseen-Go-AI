name: UnseenGo AI build

on:
  push:
    branches: [main, feature/production-framework-stack]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is not committed yet, so do not enable npm caching here.
      # This keeps CI deterministic with the repository as it exists today.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project configuration
        run: node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build) process.exit(1)"

      - name: Production build
        run: npm run build
