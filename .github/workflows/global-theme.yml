name: Global UnseenGo Theme
on:
  push:
    paths-ignore:
      - '**/*.html'
      - '**/*.htm'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add global theme script to every HTML page
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            if ! grep -q 'theme.js' "$file"; then
              python3 - "$file" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
tag='<script src="theme.js" defer></script>'
if '</head>' in s:
    s=s.replace('</head>', tag+'\n</head>', 1)
else:
    s=s.replace('</body>', tag+'\n</body>', 1)
p.write_text(s,encoding='utf-8')
PY
              changed=1
            fi
          done < <(find . -type f \( -name '*.html' -o -name '*.htm' \) -not -path './.git/*' -print0)
          if [ "$changed" = "1" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.html' '*.htm' || true
            git commit -m 'Apply global persistent light dark theme to all pages' || true
            git push
          fi
