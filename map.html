<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map · UnseenGo AI</title><link rel="stylesheet" href="unseengo-v3.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="nav"><a class="brand" href="index.html">UNSEEN<span>GO</span></a><nav class="nav-links"><a href="index.html">Home</a><a href="discover.html">Discover</a><a class="active" href="map.html">Map</a><a href="planner.html">Plan</a></nav></header><main class="section"><div class="container"><div class="eyebrow">Interactive India map</div><h1>Scroll, zoom and explore.</h1><p class="muted">Markers use real coordinates when supplied by Google Places; the fallback registry is clearly separate.</p><div class="toolbar"><input id="q" class="input" placeholder="Kurnool, Gandikota, Hampi…"><input id="city" class="input" placeholder="City filter"><button id="search" class="btn">Find places</button><a class="btn ghost" href="https://www.openstreetmap.org" target="_blank" rel="noopener">Map data</a></div><div class="map-layout"><aside class="panel map-sidebar"><div id="list" class="empty">Search to load places.</div></aside><div id="map" class="map"></div></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="unseengo-v3.js"></script><script>const map=L.map('map',{scrollWheelZoom:true}).setView([20.5937,78.9629],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let markers=[];async function run(){const q=document.querySelector('#q').value.trim()||'tourist attractions',city=document.querySelector('#city').value.trim();let data=await UnseenGoV3.liveSearch(q,city);if(!data.length)data=UnseenGoV3.FALLBACK.filter(p=>!city||p.city.toLowerCase().includes(city.toLowerCase()));markers.forEach(m=>m.remove());markers=[];data.forEach(p=>{if(p.lat==null||p.lon==null)return;const m=L.marker([p.lat,p.lon]).addTo(map).bindPopup('<b>'+UnseenGoV3.esc(p.name)+'</b><br>'+UnseenGoV3.esc(p.address||p.city||'India')+'<br><a target="_blank" href="'+UnseenGoV3.esc(p.map)+'">Open Maps</a>');markers.push(m)});document.querySelector('#list').innerHTML=data.map((p,i)=>'<button class="place-row" data-i="'+i+'"><strong>'+UnseenGoV3.esc(p.name)+'</strong><small>'+UnseenGoV3.esc(p.address||p.city||p.state||'India')+'</small></button>').join('')||'<div class="empty">No places found.</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const p=data[+b.dataset.i];if(p.lat!=null){map.setView([p.lat,p.lon],14);const m=markers.find(x=>x.getLatLng().lat===p.lat&&x.getLatLng().lng===p.lon);m?.openPopup()}});if(data[0]?.lat!=null)map.setView([data[0].lat,data[0].lon],11)}document.querySelector('#search').onclick=run;run()</script></body></html>
