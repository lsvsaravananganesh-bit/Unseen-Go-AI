<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Place · UnseenGo AI</title><link rel="stylesheet" href="unseengo-v3.css"></head><body><header class="nav"><a class="brand" href="index.html">UNSEEN<span>GO</span></a><nav class="nav-links"><a href="index.html">Home</a><a href="discover.html">Discover</a><a href="map.html">Map</a><a href="planner.html">Plan</a></nav></header><main class="section"><div class="container"><div id="root" class="panel" style="padding:26px"></div></div></main><script src="unseengo-v3.js"></script><script>(async()=>{const name=UnseenGoV3.qs('place')||UnseenGoV3.qs('name');const root=document.querySelector('#root');if(!name){root.innerHTML='<div class="empty">No place selected.</div>';return}const data=await UnseenGoV3.liveSearch(name);const p=data[0]||UnseenGoV3.FALLBACK.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){root.innerHTML='<div class="empty">Place not found.</div>';return}root.innerHTML='<div class="eyebrow">Place intelligence</div><h1>'+UnseenGoV3.esc(p.name)+'</h1><p class="muted">'+UnseenGoV3.esc(p.address||[p.city,p.state].filter(Boolean).join(', '))+'</p>'+(p.photo?'<img src="'+UnseenGoV3.esc(p.photo)+'" alt="'+UnseenGoV3.esc(p.name)+'" style="width:100%;max-height:520px;object-fit:cover;border-radius:16px">':'<div class="empty">No verified photo was returned by the configured source.</div>')+'<p>'+UnseenGoV3.esc(p.description)+'</p>'+(p.rating?'<div class="rating">★ '+UnseenGoV3.esc(p.rating)+' · '+UnseenGoV3.esc(p.userRatingCount||0)+' ratings</div>':'<div class="source">No live rating returned.</div>')+'<div class="actions"><a class="btn" target="_blank" rel="noopener" href="'+UnseenGoV3.esc(p.map)+'">Open in Google Maps</a><a class="btn ghost" href="planner.html?city='+encodeURIComponent(p.city||p.name)+'">Plan a trip here</a></div><div class="source">Source: '+UnseenGoV3.esc(p.source||'')+'</div>'})()</script></body></html>
