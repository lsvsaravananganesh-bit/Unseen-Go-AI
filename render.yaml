# Render Blueprint Configuration for UnseenGo AI
# Deploys as a full-stack Web Service on Render with Node.js & MongoDB Atlas access.
services:
  - type: web
    name: unseengo-ai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: unseengo_ai
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://jpqbvliaaucyqnhcclbz.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
