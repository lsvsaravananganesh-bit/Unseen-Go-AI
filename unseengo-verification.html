<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnseenGo AI — Data Verification</title><link rel="stylesheet" href="styles.css"><style>.verify{max-width:900px;margin:40px auto}.card{background:#fff;border:1px solid #dfe4dc;border-radius:16px;padding:22px;margin:12px 0}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef5dc;font-weight:800;font-size:12px}.meta{color:#667168;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="section verify"><div class="heading"><div><div class="eyebrow">UNSEENGO AI · PRIORITY 2</div><h1>Verified destination data</h1></div><p class="muted">Live records are read from the connected Supabase tourism database.</p></div><div class="card"><div id="status">Connecting to live data…</div><div id="stats" class="grid" style="margin-top:16px"></div></div><div class="card"><h2>Kurnool data check</h2><div id="kurnool">Checking…</div></div></main><script src="supabase-config.js"></script><script src="js/data/supabase-client.js"></script><script src="js/data/supabase-data.js"></script><script>(async()=>{const s=document.getElementById('status'),stats=document.getElementById('stats'),k=document.getElementById('kurnool');try{await new Promise(r=>{if(window.unseenGoSupabase)return r();window.addEventListener('unseengo:supabase-ready',r,{once:true});setTimeout(r,2500)});const rows=await window.UnseenGoData.loadAllPlaces();s.innerHTML='<span class="badge">LIVE · Supabase connected</span><div class="meta">Loaded '+rows.length+' active destination records from the database.</div>';stats.innerHTML='<div class="card"><b>'+new Set(rows.map(x=>x.city)).size+'</b><div class="meta">Cities represented</div></div><div class="card"><b>'+rows.filter(x=>x.verification_status==='verified').length+'</b><div class="meta">Verified places</div></div><div class="card"><b>'+rows.filter(x=>x.source_url).length+'</b><div class="meta">Records with source URL</div></div>';const d=await window.UnseenGoData.loadPlaces('Kurnool');k.innerHTML=d?'<span class="badge">PASS</span><div class="meta">'+d.city.name+', '+d.city.state+' · '+d.places.length+' active places · city status: '+(d.city.verification_status||'not supplied')+'</div>':'<span class="badge">CHECK</span> No Kurnool record returned.';}catch(e){s.innerHTML='<span class="badge">CHECK</span><div class="meta">Live data unavailable: '+e.message+'</div>';k.textContent='Unable to load Kurnool data.';}})();</script></body></html>
