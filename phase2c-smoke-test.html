<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnseenGo Phase 2C Smoke Test</title><style>body{font:16px system-ui;background:#0d120e;color:#e8eee6;padding:32px;max-width:900px;margin:auto}h1{color:#d8ff4d}.item{padding:14px;margin:8px 0;border:1px solid #303930;border-radius:12px}.ok{border-color:#607f45}.warn{border-color:#8a743b}.status{float:right;font-weight:800}</style></head><body><h1>UnseenGo · Phase 2C Smoke Test</h1><p>This page validates the deployed browser-side building blocks without inventing destination data.</p><div id="out"></div><script src="app.js"></script><script src="unseen-engine.js"></script><script src="route-engine.js"></script><script src="supabase-place-loader.js"></script><script>(async()=>{const out=document.getElementById('out');const tests=[];const add=(name,ok,detail)=>tests.push({name,ok,detail});try{add('Static destination dataset',typeof cities==='object'&&Object.keys(cities).length>0,`${typeof cities==='object'?Object.keys(cities).length:0} cities in fallback dataset`)}catch(e){add('Static destination dataset',false,e.message)}add('Recommendation engine',!!window.UnseenGoAI&&typeof window.UnseenGoAI.generate==='function','generate() available');add('Natural-language parser',!!window.UnseenGoAI&&typeof window.UnseenGoAI.parseNaturalLanguage==='function','parseNaturalLanguage() available');add('Route engine',!!window.UnseenGoRoute&&typeof window.UnseenGoRoute.optimize==='function','coordinate-aware optimizer available');add('Supabase loader',!!window.UnseenGoSupabasePlaces&&typeof window.UnseenGoSupabasePlaces.load==='function','database loader available');let rows=[];try{rows=await window.UnseenGoSupabasePlaces.load('Kurnool');add('Supabase destination data',rows.length>0,rows.length?`${rows.length} active records returned`:'0 records returned — populate/verify places before calling the database migration complete')}catch(e){add('Supabase destination data',false,e.message)}add('Route optimization data readiness',rows.some(x=>x.latitude!=null&&x.longitude!=null),rows.some(x=>x.latitude!=null&&x.longitude!=null)?'coordinates available':'no coordinates in current Supabase records');out.innerHTML=tests.map(t=>`<div class="item ${t.ok?'ok':'warn'}"><span class="status">${t.ok?'PASS':'CHECK'}</span><b>${t.name}</b><br><small>${t.detail}</small></div>`).join('')})();</script></body></html>
