<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UnseenGo AI — Phase 3.1</title>
  <style>
    body{margin:0;background:#080808;color:#f5f5f5;font:16px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:40px 20px}h1{color:#b6ff00}.panel,.card{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:16px 0}button{background:#b6ff00;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.score{font-size:42px;color:#b6ff00}.bar{height:8px;background:#292929;border-radius:5px;overflow:hidden}.fill{height:100%;background:#b6ff00}.muted{color:#aaa}.why{border-left:3px solid #b6ff00;padding-left:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{padding:12px;background:#181818;border-radius:10px}.metric b{display:block;margin-bottom:6px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>UnseenGo AI</h1>
  <p class="muted">Phase 3.1 · Explainable personalized recommendation engine</p>
  <div class="panel">
    <h2>Test recommendation</h2>
    <p><b>City:</b> Kurnool</p>
    <p><b>Interests:</b> Heritage, Photography</p>
    <p><b>Duration:</b> 2 days</p>
    <button id="run">Run Recommendation</button>
  </div>
  <div id="output" class="panel"><p class="muted">Click the button to rank available destinations.</p></div>
</div>
<script src="data/destination-registry.js"></script>
<script src="core/phase3-1-ai-recommendation.js"></script>
<script>
function run(){
  const all=(window.UnseenGoData&&Array.isArray(window.UnseenGoData.destinations))?window.UnseenGoData.destinations:[];
  const prefs={interests:['heritage','photography'],pace:'moderate',budget:null};
  const kurnool=all.filter(d=>String(d?.identity?.city||'').toLowerCase()==='kurnool');
  const ranked=window.UnseenGoRecommendation.recommend(kurnool.length?kurnool:all,prefs,5);
  const out=document.getElementById('output');
  if(!ranked.length){out.innerHTML='<h2>No destinations available</h2><p class="muted">Load the destination registry first.</p>';return;}
  out.innerHTML='<h2>Top personalized matches</h2>'+ranked.map((r,i)=>`<div class="card"><h3>${i+1}. ${r.destination.identity?.name||'Destination'}</h3><div class="score">${r.score}/100</div><p class="why">${r.explanation}</p><div class="grid">${Object.entries(r.parts).map(([k,v])=>`<div class="metric"><b>${k}</b>${Math.round(v)}<div class="bar"><div class="fill" style="width:${Math.round(v)}%"></div></div></div>`).join('')}</div></div>`).join('');
}
document.getElementById('run').addEventListener('click',run);
</script>
</body>
</html>
